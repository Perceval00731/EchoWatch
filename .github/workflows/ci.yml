name: ESP32 Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Add local libraries
        run: |
          mkdir -p ~/Arduino/libraries
          cp -r libraries/* ~/Arduino/libraries/

      - name: Compile EchoWatch (ESP32-S3 Huge App)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:CDCOnBoot=default,USBMode=default,UploadSpeed=921600,PartitionScheme=huge_app,DebugLevel=none \
            ./LVGL_Arduino/LVGL_Arduino.ino
